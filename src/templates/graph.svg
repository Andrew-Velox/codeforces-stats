<svg xmlns="http://www.w3.org/2000/svg" width="540" height="200" viewBox="0 0 540 200" role="img" aria-label="Rating History for {{ handle }}">
  <title>{{ handle }} | Rating History</title>
  
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="{{ line_color }}" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="{{ line_color }}" stop-opacity="0.08"/>
      <stop offset="95%" stop-color="{{ line_color }}" stop-opacity="0.0"/>
    </linearGradient>

    <clipPath id="chartClip">
      <rect x="-10" y="-10" width="440" height="135"/>
    </clipPath>
  </defs>

  <style>
    <![CDATA[
    /* A more extensive modern sans-serif stack */
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol"; }
    
    /* Subtle themeable background/border colors with modern width */
    .card-bg { fill: #{{ theme.bg_color }}; stroke: #{{ theme.border_color }}; stroke-width: 1.5; stroke-opacity: 0.5; }
    
    /* Clear header hierarchy and premium title styling */
    .graph-header-title { font-size: 16px; font-weight: 700; fill: #{{ theme.title_color }}; letter-spacing: 0.2px; }
    .graph-header-handle { font-size: 20px; font-weight: 600; fill: #{{ theme.icon_color }}; opacity: 0.8; }
    .color-handle { fill: {{ line_color }} !important; opacity: 1; }
    
    /* Subtler axis labels for clarity without clutter */
    .axis-label { font-size: 10px; fill: #{{ theme.icon_color }}; font-weight: 600; opacity: 0.7; }
    
    /* Grid elements updated to subtle dashed lines */
    .chart-gridline { stroke: #{{ theme.border_color }}; stroke-opacity: 0.2; stroke-width: 1; stroke-dasharray: 4 4; }
    .chart-baseline { stroke: #{{ theme.border_color }}; stroke-opacity: 0.5; stroke-width: 1.5; stroke-linecap: round; }
    
    /* Enhanced interaction for points */
    .chart-point { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: crosshair; }
    .chart-point:hover { stroke-width: 3.5px; r: 5.5px; }
    
    /* 8-second infinite cycle animations — mirrors card template style */
    @keyframes graphHeaderFadeIn {
      0%  { opacity: 0; transform: translateY(8px); }
      3%  { opacity: 1; transform: translateY(0); }
      100%{ opacity: 1; transform: translateY(0); }
    }
    @keyframes graphChartFadeIn {
      0%  { opacity: 0; }
      3%  { opacity: 1; }
      100%{ opacity: 1; }
    }
    @keyframes drawLine-cycle {
      0%, 4%  { stroke-dashoffset: 10000; }
      25%     { stroke-dashoffset: 0; }
      100%    { stroke-dashoffset: 0; }
    }
    @keyframes fadeArea-cycle {
      0%, 22% { opacity: 0; }
      35%     { opacity: 1; }
      100%    { opacity: 1; }
    }
    .modern-animate-in { animation: graphHeaderFadeIn 8s linear infinite; }
    .chart-animate-in  { animation: graphChartFadeIn  8s linear infinite; }
    .chart-line {
      stroke-dasharray: 10000;
      stroke-dashoffset: 10000;
      animation: drawLine-cycle 8s linear infinite;
    }
    .chart-area {
      opacity: 0;
      animation: fadeArea-cycle 8s linear infinite;
    }
    ]]>
  </style>

  <rect x="8" y="8" width="524" height="184" rx="12" ry="12" class="card-bg" filter="url(#shadow)"/>

  <image href="{{ logo_b64 }}" x="499" y="17" width="20" height="20" opacity="0.90"/>

  <g class="modern-animate-in">
    <text x="32" y="34" class="graph-header-title">Rating History</text>
    
    <rect x="148" y="21" width="1.8" height="16" fill="#{{ theme.border_color }}" opacity="0.5" rx="1.5"/>
    <svg x="154" y="20" width="15" height="15" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1.5 3.5L3.5 6.5L6 2L8.5 6.5L10.5 3.5L9.5 9H2.5L1.5 3.5Z" fill="{{ max_rank_color }}" stroke="{{ max_rank_color }}" stroke-width="1" stroke-linejoin="round"/>
      <rect x="2" y="10" width="8" height="1.5" rx="0.5" fill="{{ max_rank_color }}"/>
    </svg>
    <text x="173" y="33.5" class="graph-header-handle color-handle">{{ handle }}</text>
  </g>

  <g transform="translate(65, 45)">
    <g class="chart-animate-in">
      
      <g clip-path="url(#chartClip)" opacity="0.60">
        {% for band in rating_bands %}
        <rect x="0" y="{{ band.y }}" width="420" height="{{ band.height }}" fill="{{ band.color }}"/>
        {% endfor %}
      </g>

      {% for tick in y_ticks %}
      <line x1="0" y1="{{ tick.y }}" x2="420" y2="{{ tick.y }}" class="chart-gridline"/>
      <text x="-14" y="{{ tick.y }}" text-anchor="end" dominant-baseline="middle" class="axis-label">{{ tick.label }}</text>
      {% endfor %}

      <line x1="0" y1="115" x2="420" y2="115" class="chart-baseline"/>

      <path d="{{ area_path }}" fill="url(#areaGrad)" clip-path="url(#chartClip)" class="chart-area"/>

      <path d="{{ line_path }}" fill="none" stroke="{{ line_color }}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#chartClip)" class="chart-line"/>

      {% for dot in dots %}
      <circle cx="{{ dot.x }}" cy="{{ dot.y }}" r="0" fill="{% if dot.isLast %}{{ dot.color }}{% else %}{{ line_color }}{% endif %}" stroke="#{{ theme.bg_color }}" stroke-width="{% if dot.isLast %}2.5{% else %}1.5{% endif %}" class="chart-point" opacity="0">
        <animate attributeName="r"
          values="0;0;{% if dot.isLast %}6.5{% else %}3.9{% endif %};{% if dot.isLast %}5{% else %}3{% endif %};{% if dot.isLast %}5{% else %}3{% endif %}"
          keyTimes="0;{{ ((0.32 + 1.68 * dot.x / 420) / 8) | round(4) }};{{ ((0.32 + 1.68 * dot.x / 420) / 8 + 0.008) | round(4) }};{{ ((0.32 + 1.68 * dot.x / 420) / 8 + 0.013) | round(4) }};1"
          dur="8s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="opacity"
          values="0;0;{% if dot.isLast %}1{% else %}0.5{% endif %};{% if dot.isLast %}1{% else %}0.5{% endif %}"
          keyTimes="0;{{ ((0.32 + 1.68 * dot.x / 420) / 8) | round(4) }};{{ ((0.32 + 1.68 * dot.x / 420) / 8 + 0.013) | round(4) }};1"
          dur="8s" repeatCount="indefinite"/>
        <title>{{ dot.contest_name }} | Rating: {{ dot.rating }} ({{ dot.date }})</title>
      </circle>
      {% endfor %}

      <!-- Peak rating: double pulsing ring + solid dot + label -->
      <circle cx="{{ peak_dot.x }}" cy="{{ peak_dot.y }}" r="9" fill="none"
        stroke="{{ peak_dot.color }}" stroke-width="1.5" clip-path="url(#chartClip)" opacity="0">
        <animate attributeName="r" values="9;24" dur="2s"
          begin="{{ (0.32 + 1.68 * peak_dot.x / 420) | round(2) }}s"
          repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2s"
          begin="{{ (0.32 + 1.68 * peak_dot.x / 420) | round(2) }}s"
          repeatCount="indefinite"/>
      </circle>
      <circle cx="{{ peak_dot.x }}" cy="{{ peak_dot.y }}" r="9" fill="none"
        stroke="{{ peak_dot.color }}" stroke-width="1.5" clip-path="url(#chartClip)" opacity="0">
        <animate attributeName="r" values="9;24" dur="2s"
          begin="{{ (0.32 + 1.68 * peak_dot.x / 420 + 1) | round(2) }}s"
          repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.7;0" dur="2s"
          begin="{{ (0.32 + 1.68 * peak_dot.x / 420 + 1) | round(2) }}s"
          repeatCount="indefinite"/>
      </circle>
      <!-- Solid filled peak dot (drawn on top of regular dots) -->
      <circle cx="{{ peak_dot.x }}" cy="{{ peak_dot.y }}" r="0"
        fill="white" stroke="{{ peak_dot.color }}" stroke-width="2"
        clip-path="url(#chartClip)" opacity="0">
        <animate attributeName="r"
          values="0;0;8;6;6"
          keyTimes="0;{{ ((0.32 + 1.68 * peak_dot.x / 420) / 8) | round(4) }};{{ ((0.32 + 1.68 * peak_dot.x / 420) / 8 + 0.008) | round(4) }};{{ ((0.32 + 1.68 * peak_dot.x / 420) / 8 + 0.016) | round(4) }};1"
          dur="8s" repeatCount="indefinite" calcMode="linear"/>
        <animate attributeName="opacity"
          values="0;0;1;1"
          keyTimes="0;{{ ((0.32 + 1.68 * peak_dot.x / 420) / 8) | round(4) }};{{ ((0.32 + 1.68 * peak_dot.x / 420) / 8 + 0.016) | round(4) }};1"
          dur="8s" repeatCount="indefinite"/>
      </circle>
      <!-- Speech bubble box for peak rating -->
      <g opacity="0">
        <animate attributeName="opacity"
          values="0;0;0.95;0.95"
          keyTimes="0;{{ ((0.32 + 1.68 * peak_dot.x / 420) / 8) | round(4) }};{{ ((0.32 + 1.68 * peak_dot.x / 420) / 8 + 0.02) | round(4) }};1"
          dur="8s" repeatCount="indefinite"/>
        <!-- Box background -->
        <rect x="{{ peak_dot.x - 27 }}" y="{{ peak_dot.y - 42 }}"
          width="54" height="24" rx="5" ry="5"
          fill="{{ peak_dot.color }}" />
        <!-- Triangle pointer pointing down to the dot -->
        <polygon
          points="{{ peak_dot.x - 5 }},{{ peak_dot.y - 18 }} {{ peak_dot.x + 5 }},{{ peak_dot.y - 18 }} {{ peak_dot.x }},{{ peak_dot.y - 10 }}"
          fill="{{ peak_dot.color }}" />
        <!-- Rating text inside the box -->
        <text x="{{ peak_dot.x }}" y="{{ peak_dot.y - 30 }}"
          text-anchor="middle" dominant-baseline="middle"
          font-size="13" font-weight="700" fill="white">{{ peak_dot.rating }}</text>
      </g>

      {% for tick in x_ticks %}
      <text x="{{ tick.x }}" y="136" text-anchor="middle" class="axis-label">{{ tick.label }}</text>
      {% endfor %}
      
    </g>
  </g>
</svg>